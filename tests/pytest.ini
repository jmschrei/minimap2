[pytest]
testpaths = .
addopts = -ra --strict-markers
markers =
	pinned: pins the current output of base minimap2 instead of an independently derived value
	external: uses samtools or pysam when present; skipped otherwise
	thread_invariance: compares output across thread counts or batch sizes
	mappy: uses the mappy Python binding (skipped without Cython and setuptools)
	k8: runs a misc/*.js script with k8 (skipped when k8 is not on PATH)
